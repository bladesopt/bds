name: Profile production BDS and NOMAD, big, s2mpj

on:
  workflow_dispatch:

jobs:
  test:
    name: Profile production BDS and NOMAD, big, s2mpj
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        matlab: [latest]
        size: [big]
        with_optim_toolbox: [yes]
        solver: [bds-production-500n]
        competitor: [nomad-500n]
        plibs: [s2mpj]
        run_plain: [false]
        summarize_log_ratio_profiles: [false]
        feature: [plain, perturbed_x0_0.001, perturbed_x0_1, perturbed_x0_10, perturbed_x0_100, noisy_1e-1, noisy_1e-2, noisy_1e-3, noisy_1e-4, truncated_1, truncated_2, truncated_3, truncated_4, permuted, linearly_transformed, random_nan_5, random_nan_10, random_nan_20, quantized_1, quantized_2, quantized_3, quantized_4, rotation_noisy_1e-1, rotation_noisy_1e-2, rotation_noisy_1e-3, rotation_noisy_1e-4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: 5a19e88cc34f9b8925e111934a6b12011422fcdb

      - name: Checkout Nomad
        uses: actions/checkout@v4
        with:
          repository: bbopt/nomad
          path: nomad

      - name: Install Texlive
        run: sudo apt-get update && sudo apt-get install -y texlive

      - name: Check whether LaTeX is installed
        run: pdflatex --version

      - name: Cache MATLAB
        id: cache-matlab
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/MATLAB
          key: ${{ matrix.os }}-${{ matrix.matlab }}-${{ matrix.with_optim_toolbox }}

      - name: Set up MATLAB with optimization toolbox
        if: ${{ matrix.with_optim_toolbox == 'yes' }}
        uses: matlab-actions/setup-matlab@v2.1.2
        with:
          release: ${{ matrix.matlab }}
          products: Optimization_Toolbox

      - name: Set up Nomad
        run: |
          cd ./nomad
          cmake --version
          cmake -DTEST_OPENMP=OFF -DBUILD_INTERFACE_MATLAB=ON -S . -B build/release
          cmake --build build/release
          cmake --install build/release
          find /usr/lib /lib -name "libstdc++.so.6"

      - name: Set LD_PRELOAD
        run: echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6" >> "$GITHUB_ENV"

      - name: Set MATLAB runtime library path
        run: |
          matlab_root=$(dirname "$(dirname "$(readlink -f "$(command -v matlab)")")")
          test -f "$matlab_root/bin/glnxa64/libmex.so"
          test -f "$matlab_root/bin/glnxa64/libmx.so"
          test -f "$matlab_root/bin/glnxa64/libut.so"
          test -f "$matlab_root/extern/bin/glnxa64/libMatlabEngine.so"
          echo "LD_LIBRARY_PATH=$matlab_root/bin/glnxa64:$matlab_root/extern/bin/glnxa64:$matlab_root/sys/os/glnxa64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Nomad runtime linking
        run: |
          ldd nomad/build/release/lib/nomadOpt.mexa64
          if ldd nomad/build/release/lib/nomadOpt.mexa64 | grep -q 'not found'; then
            exit 1
          fi

      - name: Run test
        uses: matlab-actions/run-command@v2.1.1
        with:
            command: |
              root_dir = pwd()
              ls

              % Setup optiprofiler
              cd(fullfile(root_dir, 'optiprofiler'));
              setup(struct('install_matcutest', false));
              cd(root_dir);

              % Setup bds
              setup
              cd(fullfile(root_dir, 'tests', 'competitors'));
              addpath(pwd);

              % Setup nomad
              cd(fullfile(root_dir, 'nomad', 'build', 'release', 'lib'));
              addpath(pwd);

              % profile
              cd(fullfile(root_dir, 'tests'));
              options = struct();
              options.feature_name = '${{ matrix.feature }}';
              options.solver_names = {'${{ matrix.solver }}', '${{ matrix.competitor }}'};
              options.mindim = 6;
              options.maxdim = 50;
              options.plibs = '${{ matrix.plibs }}';
              % A second randomized run makes several NOMAD big features exceed
              % GitHub's six-hour job limit. Keep the full problem set, feature
              % set, dimension range, solvers, and 500*n budget, but use one
              % reproducible realization for this comparison.
              options.n_runs = 1;
              options.run_plain = ${{ matrix.run_plain }};
              options.summarize_log_ratio_profiles = ${{ matrix.summarize_log_ratio_profiles }};
              % Per-problem history plots are auxiliary and can stall after all
              % solver runs finish. The merged performance/data profiles below
              % do not depend on them.
              options.draw_hist_plots = 'none';
              profile_optiprofiler(options);
              cd(root_dir);
              cd(fullfile(root_dir, 'tests'));
              ls -R
              cd(root_dir);

      - name: Change the summary file name
        run: |
          cd ./tests/testdata/
          ls -R
          find . -type f -name 'summary.pdf' | while read -r file; do
            # Obtain the parent directory and name
            parent_dir=$(dirname "$file")
            parent_name=$(basename "$parent_dir")

            # Strip the trailing timestamp from the profile directory name.
            new_name=$(bash "$GITHUB_WORKSPACE/tests/tools/strip_profile_timestamp.sh" "$parent_name")

            # Print the new name
            echo "New name: $new_name"

            # Obtain the directory name
            dir_name=$(dirname "$file")

            # Establish the new file name
            new_file="$dir_name/summary_$new_name.pdf"

            # Check if the source and destination are the same
            if [ "$file" != "$new_file" ]; then
              mv "$file" "$new_file"
              echo "Renamed $file to $new_file"
            else
              echo "Source and destination are the same, skipping: $file"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile_optiprofiler_${{ matrix.solver }}_${{ matrix.competitor }}_${{ matrix.size }}_${{ matrix.feature }}_${{ matrix.run_plain }}_${{ matrix.plibs }}
          path: ./tests/testdata/

  merge_artifacts:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: tests/testdata/downloaded_artifacts

      - name: List all files
        run: |
          cd tests/testdata/downloaded_artifacts
          ls -R

      - name: Merge PDF files
        run: |
          cp tests/tools/merge_pdf.sh tests/testdata/downloaded_artifacts
          cp tests/tools/get_base_info.sh tests/testdata/downloaded_artifacts
          cd tests/testdata/downloaded_artifacts/

          source ./get_base_info.sh
          echo "Base info extracted: ${BASE_INFO}"
          echo "BASE_INFO=${BASE_INFO}" >> "$GITHUB_ENV"

          # Merge PDF files
          mkdir summary
          find . -maxdepth 3 -type f -name 'summary*.pdf' -exec cp -n {} summary/ \;
          cd summary
          ls
          bash ../merge_pdf.sh
          mv merged.pdf "summary_${BASE_INFO}.pdf"
          cd ..
          if [ -d "summary" ]; then
            mv summary "summary_${BASE_INFO}"
          fi

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        env:
          BASE_INFO: ${{ env.BASE_INFO }}
        with:
          name: merged_profiles_${{ env.BASE_INFO }}
          path: tests/testdata/downloaded_artifacts/**

      - name: Upload summary files
        uses: actions/upload-artifact@v4
        env:
          BASE_INFO: ${{ env.BASE_INFO }}
        with:
          name: summary_files_${{ env.BASE_INFO }}
          path: tests/testdata/downloaded_artifacts/summary_${{ env.BASE_INFO }}/**
