name: Check TeX_Bib Spelling

on:
  push:
    branches-ignore:
      - restore_bfo_nomad_workflows
    paths:
      - '**.tex'
      - '**.bib'
      - '**.txt'
      - '**.yml'


jobs:
  spelling_check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Hunspell
      run: sudo apt-get update && sudo apt-get install -y hunspell

    - name: Check spelling
      id: check_spelling
      run: |
        while IFS= read -r -d '' source_file; do
          hunspell -l -t -d en_US "$source_file" |
            grep -v -w -f .github/actions/spell_check/custom_dictionary.txt \
              > "${source_file}_spelling_errors.txt" || true
        done < <(find . -type f \( -name "*.tex" -o -name "*.bib" \) \
          ! -path "./research/*" ! -name "custom_dictionary.txt" -print0)

        errors_found=false
        while IFS= read -r -d '' error_file; do
          if [ -s "$error_file" ]; then
            errors_found=true
            break
          fi
        done < <(find . -type f -name "*_spelling_errors.txt" -print0)

        if [ "$errors_found" = true ]; then
          echo "Spelling errors summary:" > spelling_errors_summary.txt
          while IFS= read -r -d '' error_file; do
            if [ -s "$error_file" ]; then
              {
                echo "Spelling errors found in $(basename "$error_file" _spelling_errors.txt):"
                cat -- "$error_file"
                echo
              } >> spelling_errors_summary.txt
            fi
          done < <(find . -type f -name "*_spelling_errors.txt" -print0)
          echo "Please fix the spelling errors listed in 'spelling_errors_summary.txt'."
          cat spelling_errors_summary.txt
          exit 1
        else
          echo "No spelling errors found."
          find . -type f -name "*_spelling_errors.txt" -delete
        fi

    - name: Upload spelling errors summary
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: spelling_errors_summary
        path: spelling_errors_summary.txt
